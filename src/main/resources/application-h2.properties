# ============================================================
# Conexion con H2 - Perfil de desarrollo
# ============================================================

# Para activar este perfil desde Eclipse:
# Run -> Run Configurations... -> Arguments -> Program arguments
# --spring.profiles.active=h2
#
# De esta forma Spring Boot utiliza este archivo:
# application-h2.properties

# URL de conexion a H2.
# "mem" indica que la base de datos se almacena en memoria.
# Los datos se pierden al detener la aplicacion.
spring.datasource.url=jdbc:h2:mem:empleados

# Usuario utilizado para conectarse a H2.
spring.datasource.username=sa

# H2 no utiliza contrasena en esta configuracion.
spring.datasource.password=

# Driver JDBC utilizado para conectar con H2.
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crea las tablas al iniciar la aplicacion.
# Al utilizar H2 en memoria, la base de datos se crea
# nuevamente cada vez que se inicia Spring Boot.
spring.jpa.hibernate.ddl-auto=create

# Muestra en la consola las sentencias SQL generadas por Hibernate.
spring.jpa.show-sql=true
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestión de empleados</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>

<body class="bg-light">

	<div class="container mt-5">

		<div class="card shadow">

			<div class="card-header">
				<h2 class="mb-0">Gestión de empleados</h2>
			</div>

			<div class="card-body">

				<div class="d-flex justify-content-between align-items-center mb-3">

					<h4 class="mb-0">Empleados</h4>

					<a href="/web/empleados/nuevo" class="btn btn-primary"> Nuevo
						empleado </a>

				</div>


				<!-- Mensaje de error -->
				<div id="mensajeError" class="alert alert-danger d-none"
					role="alert"></div>


				<table class="table table-striped table-hover align-middle">

					<thead class="table-dark">

						<tr>
							<th>ID</th>
							<th>Nombre</th>
							<th class="text-center">Acciones</th>
						</tr>

					</thead>

					<tbody>


						<!--
 						* th:each recorre la lista de empleados recibida en el Model.
 						* Se genera una fila <tr> por cada empleado.
						-->
						<tr th:each="empleadoItem : ${listaEmpleados}">

							<td th:text="${empleadoItem.id}"></td>

							<td th:text="${empleadoItem.nombre}"></td>

							<td class="text-center"><a
								th:href="@{/web/empleados/editar/{id}(id=${empleadoItem.id})}"
								class="btn btn-sm btn-warning me-1"> Editar </a>

								<button type="button" class="btn btn-sm btn-danger"
									th:onclick="'borrarEmpleado(' + ${empleadoItem.id} + ')'">
									Borrar</button></td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>

	<!-- Alerta con mensaje de información de borrado de empleado -->
	<!-- será solo visible cuando exista eliminado=true  -->
	<div id="mensajeEliminado" class="alert alert-success d-none"
		role="alert">Empleado eliminado correctamente.</div>


	<!-- ========================================================== -->
	<!-- Modal de confirmación de borrado                           -->
	<!-- Modal = ventana emergente integrada en la página mediante  -->
	<!-- Bootstrap.                                                 -->
	<!-- ========================================================== -->

	<div class="modal fade" id="modalEliminar" tabindex="-1"
		aria-labelledby="modalEliminarLabel" aria-hidden="true">

		<div class="modal-dialog">

			<div class="modal-content">

				<div class="modal-header">

					<h5 class="modal-title" id="modalEliminarLabel">Confirmar
						eliminación</h5>

					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Cerrar"></button>

				</div>

				<div class="modal-body">¿Está seguro de que desea eliminar
					este empleado?</div>

				<div class="modal-footer">

					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Cancelar</button>

					<button type="button" class="btn btn-danger"
						id="btnConfirmarEliminar">Borrar</button>

				</div>
			</div>
		</div>
	</div>


	<!-- Bootstrap JavaScript -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
		
	</script>

	<script>

    // Comprueba si la URL contiene ?eliminado=true.
    const parametros =
        new URLSearchParams(window.location.search);

    if (parametros.get("eliminado") === "true") {

        const mensaje =
            document.getElementById("mensajeEliminado");

        mensaje.classList.remove("d-none");
        
     // Elimina ?eliminado=true de la URL sin recargar la página.
     // Así, al recargar la página, la URL no mantiene el parámetro
     // eliminado=true y el mensaje no vuelve a mostrarse.
        window.history.replaceState(
            {},
            document.title,
            "/web/empleados"
        );
    }


    // Guarda temporalmente el ID del empleado que queremos eliminar.
    let idEmpleadoEliminar;


    // Abre el modal de confirmación.
    function borrarEmpleado(id) {

        idEmpleadoEliminar = id;

        const modalElemento =
            document.getElementById("modalEliminar");

        const modal =
            new bootstrap.Modal(modalElemento);

        modal.show();
    }


    // Ejecuta el DELETE cuando se pulsa "Borrar"
    // dentro del modal.
    document
        .getElementById("btnConfirmarEliminar")
        .addEventListener("click", function() {

            /*
             * fetch() realiza una petición HTTP desde JavaScript.
             *
             * En este caso:
             *
             * DELETE /empleados/{id}
             */
            fetch("/empleados/" + idEmpleadoEliminar, {

                method: "DELETE"

            })

            .then(response => {

                // 204 significa que se ha eliminado correctamente.
                if (response.status === 204) {
                    return;
                }

                // 404 significa que el empleado no existe.
                if (response.status === 404) {
                    throw new Error(
                        "El empleado no existe."
                    );
                }

                throw new Error(
                    "Error al eliminar el empleado."
                );

            })

            .then(() => {

                // Volvemos a cargar la lista indicando
                // que el empleado se ha eliminado.
                window.location.href =
                    "/web/empleados?eliminado=true";

            })

            .catch(error => {

                console.error(error);

                // Obtener el modal de Bootstrap.
                const modalElemento =
                    document.getElementById("modalEliminar");

                // Recuperar la instancia del modal ya existente.
                const modal =
                    bootstrap.Modal.getInstance(modalElemento);

                // Cerrar el modal.
                modal.hide();

                // Mostrar el mensaje de error.
                const mensaje =
                    document.getElementById("mensajeError");

                mensaje.textContent =
                    error.message;

                mensaje.classList.remove("d-none");

            });

        });

</script>

</body>

</html>

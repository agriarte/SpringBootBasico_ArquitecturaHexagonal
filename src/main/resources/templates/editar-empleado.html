<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Editar empleado</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header">
                <h2 class="mb-0">Editar empleado</h2>
            </div>

            <div class="card-body">

                <form id="formEditarEmpleado">

                    <!--
                     * El ID identifica al empleado que estamos editando.
                     *
                     * Thymeleaf obtiene el valor desde el objeto "empleado"
                     * que el EmpleadosWebController ha colocado en el Model.
                     *
                     * readonly impide que el usuario pueda modificar el ID.
                     *
                     * El ID fue generado automáticamente por H2 al crear
                     * el empleado y no debe cambiar durante una edición.
                     -->
                    <div class="mb-3">

                        <label for="id" class="form-label">
                            ID
                        </label>

                        <input
                            type="number"
                            id="id"
                            class="form-control"
                            th:value="${empleado.id}"
                            readonly>

                    </div>


                    <!--
                     * El nombre sí puede ser modificado por el usuario.
                     *
                     * th:value coloca en el campo el nombre actual
                     * del empleado.
                     -->
                    <div class="mb-3">

                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            class="form-control"
                            th:value="${empleado.nombre}"
                            required>

                    </div>


                    <button type="submit"
                            class="btn btn-primary">
                        Guardar cambios
                    </button>

                    <!--
                     * No modifica ningún dato.
                     *
                     * Simplemente vuelve a la lista de empleados.
                     * Al no ejecutarse ningún PUT, los cambios realizados
                     * en el formulario se descartan.
                     -->
                    <a href="/web/empleados"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>


                <!--
                 * Mensaje mostrado después de realizar correctamente
                 * el PUT.
                 *
                 * d-none mantiene inicialmente oculto el mensaje.
                 * JavaScript quitará esta clase cuando la modificación
                 * haya terminado correctamente.
                 -->
                <div
                    id="mensajeExito"
                    class="alert alert-success d-none mt-3">

                    <h5 class="alert-heading">
                        Empleado modificado correctamente.
                    </h5>

                    <p class="mb-0">
                        Los datos del empleado han sido actualizados.
                    </p>

                    <a
                        href="/web/empleados"
                        class="btn btn-success mt-3">
                        Ver empleados
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script>

        /*
         * ============================================================
         * Envío del formulario
         * ============================================================
         *
         * Cuando el usuario pulsa "Guardar cambios", se produce el
         * evento submit del formulario.
         *
         * JavaScript captura ese evento y realiza el PUT mediante fetch().
         */
        document
            .getElementById("formEditarEmpleado")
            .addEventListener("submit", function(event) {

                /*
                 * Evita el comportamiento tradicional del formulario,
                 * que provocaría una navegación/recarga de la página.
                 *
                 * Nosotros realizaremos la petición mediante fetch().
                 */
                event.preventDefault();


                /*
                 * Obtiene el ID del empleado desde el campo del formulario.
                 *
                 * Number() convierte el valor recibido del HTML
                 * (que es texto) en un número.
                 *
                 * Este ID identifica qué empleado será modificado.
                 */
                const id = Number(
                    document.getElementById("id").value
                );


                /*
                 * Construye el objeto JavaScript que se enviará
                 * al endpoint REST.
                 *
                 * El ID se mantiene porque identifica el empleado.
                 * El nombre contiene el nuevo valor introducido
                 * por el usuario.
                 */
                const empleado = {

                    id: id,

                    nombre:
                        document.getElementById("nombre").value
                };


                /*
                 * ====================================================
                 * PUT /empleados/{id}
                 * ====================================================
                 *
                 * fetch() realiza la petición HTTP contra nuestra API REST.
                 *
                 * Ejemplo:
                 *
                 * PUT /empleados/3
                 *
                 * El objeto "empleado" se convierte a JSON y se
                 * envía en el cuerpo de la petición.
                 */
                fetch("/empleados/" + id, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    /*
                     * JSON.stringify() convierte el objeto JavaScript
                     * en una cadena JSON.
                     */
                    body: JSON.stringify(empleado)

                })


                /*
                 * Procesamos la respuesta HTTP recibida de Spring Boot.
                 */
                .then(response => {

                    /*
                     * response.ok es true cuando el servidor responde
                     * con un código HTTP entre 200 y 299.
                     */
                    if (!response.ok) {

                        throw new Error(
                            "Error al modificar el empleado"
                        );
                    }

                    /*
                     * El Controller REST devuelve el EmpleadoDTO
                     * modificado en formato JSON.
                     *
                     * Lo convertimos en un objeto JavaScript.
                     */
                    return response.json();

                })


                /*
                 * La respuesta JSON no la necesitamos en este momento.
                 *
                 * Solo necesitamos saber que la modificación ha sido
                 * realizada correctamente.
                 */
                .then(() => {

                    /*
                     * Oculta el formulario.
                     */
                    document
                        .getElementById("formEditarEmpleado")
                        .classList.add("d-none");

                    /*
                     * Muestra el mensaje de confirmación.
                     */
                    document
                        .getElementById("mensajeExito")
                        .classList.remove("d-none");

                })


                /*
                 * Captura los errores producidos durante el proceso.
                 */
                .catch(error => {

                    console.error(error);

                });

            });

    </script>

</body>

</html>
